name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: naturedb
          POSTGRES_USER: nature
          POSTGRES_PASSWORD: nature
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nature"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      POSTGRES_DB: naturedb
      POSTGRES_USER: nature
      POSTGRES_PASSWORD: nature
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -m ""
