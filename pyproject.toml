[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parcel-nature-screening"
version = "0.1.0"
description = "Parcel-based biodiversity potential screening tool for Finland"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "psycopg[binary]",
    "sqlalchemy",
    "geopandas",
    "shapely",
    "pyogrio",
    "requests",
    "pandas",
    "geoalchemy2"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
    "ipykernel"
]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100