[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parcel-nature-screening"
version = "0.1.0"
description = "Parcel-based biodiversity potential screening tool for Finland"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "psycopg[binary]",
    "sqlalchemy",
    "geopandas",
    "shapely",
    "pyogrio",
    "requests",
    "pandas",
    "geoalchemy2",
    "alembic"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
    "ipykernel"
]

[tool.pytest.ini_options]
markers = [
    "integration: requires a running PostGIS database (docker compose up -d db)",
]
# Excluded by default so plain `pytest` works without Docker running;
# `pytest -m integration` runs them explicitly.
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100