services:
  db:
    image: postgis/postgis:16-3.4
    container_name: parcel_nature_postgis
    environment:
      POSTGRES_DB: naturedb
      POSTGRES_USER: nature
      POSTGRES_PASSWORD: nature
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: parcel_nature_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgis_data: